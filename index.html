<style>

.two{grid-template-columns:2fr 1fr}
@media(max-width:900px){.two{grid-template-columns:1fr}aside{display:none}body{display:block}.mnav{display:flex!important}main{padding:22px 16px 110px}h1{font-size:25px}}

.btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}.btn.sm{padding:7px 13px;font-size:12px}.btn.ok{background:var(--acc2);color:#04241b}.btn.del{background:none;color:var(--bad);border:1px solid var(--line)}

.post{margin-bottom:16px}.post pre{white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.6;margin:12px 0;background:#0c0d12;padding:16px;border-radius:16px;border:1px solid var(--line)}

.good{color:var(--acc2)}.badc{color:var(--bad)}.btn.sec,.btn.del,.btn.ok{box-shadow:none}

.bar{height:10px;background:#0c0d12;border-radius:9px;overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#3d6bff,#9a4dff 50%,#19e68c);border-radius:9px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:20px}
.help{font-size:12px;color:var(--mut);margin:4px 0 10px;line-height:1.55}
.step{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;align-items:center;justify-content:center;font-size:13px;margin-right:8px;font-weight:700}
.prow{padding:16px 20px;margin-bottom:12px}.prow summary{cursor:pointer;list-style:none}.prow summary::-webkit-details-marker{display:none}.prow[open]>summary{padding-bottom:4px}
.idea{border-radius:14px!important;line-height:1.4;padding:9px 13px!important}
a{color:var(--acc)}
.row>.btn{max-width:100%;white-space:normal;text-align:left}
.drop{border:2px dashed var(--line);border-radius:18px;padding:26px;text-align:center;color:var(--mut);cursor:pointer;transition:.15s;margin-top:12px}.drop:hover,.drop.on{border-color:var(--acc);color:var(--txt);background:rgba(61,107,255,.06)}
.imp{width:100%;overflow:auto;margin-top:14px}.imp table{min-width:900px}.imp td{padding:6px;vertical-align:top}.imp input,.imp select,.imp textarea{padding:6px 8px;border-radius:10px;font-size:12px}.imp textarea{min-height:54px}.imp select{min-width:118px}.imp input[type=date]{min-width:140px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi .v{font-size:26px}#toast{bottom:96px;right:12px;left:12px;max-width:none}}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}

<aside>
  <div class="logo">VLS</div>

<script>
/* ===================== PROFIL VLS ===================== */
const KEY='postpilot_vls_v1';
const PLS=['linkedin','instagram'];
const PLN={linkedin:'LinkedIn',instagram:'Instagram'};
const PLT={linkedin:'li',instagram:'ig'};
const BRAND={name:'VLS',short:'Event technology · depuis 1983',site:'https://www.vls.fr/',
 sector:"Prestataire technique événementiel et pionnier du mapping depuis 1983 (Buc, Yvelines ; groupe MPM) : vidéo, lumière, son, structure et énergie, de la conception à l'exploitation. Trois expertises : Grande Image (mapping 3D, projection monumentale, murs LED, expériences immersives), Event (séminaires, conventions, lancements, concerts, festivals, plateaux TV, captation et streaming) et Technisite (gestion technique audiovisuelle d'hôtels, business centers et centres de congrès)",
 topics:"mapping vidéo et projection monumentale, fêtes des lumières, mise en lumière du patrimoine, technique audiovisuelle d'événements d'entreprise (conventions, séminaires, lancements, galas, événements hybrides, streaming), scénographie immersive, murs LED, sonorisation, régie, sécurité des structures, sobriété énergétique de l'événementiel, actualité de l'événementiel et du spectacle vivant",
 audience:"Agences événementielles, directions communication et événementiel d'entreprises, collectivités et offices de tourisme (fêtes des lumières, patrimoine), maisons de luxe et marques, hôtels, business centers et centres de congrès, institutions, artistes et producteurs de spectacles",
 tone:"LinkedIn : expert, concret, fier sans emphase, vouvoiement, un fait réel par post, remerciements nominatifs aux partenaires cités dans la fiche, CTA discret (proposition en 24 heures, parlez à un expert). Instagram : émotionnel et visuel, phrases courtes, accroche qui donne envie de regarder l'image, emojis mesurés, vouvoiement, appel à l'échange en commentaire",
 pillars:"LinkedIn : réalisations / preuve 35 %, expertise et pédagogie 25 %, coulisses et équipe 20 %, partenaires et réseau 10 %, offre 5 %, communauté 5 %. Instagram : réalisations visuelles 40 %, coulisses 30 %, équipe 15 %, expertise 10 %, offre 5 %",
 facts:"Faits vérifiés sur VLS (site vls.fr) : créée en 1983 ; basée à Buc, à quelques minutes de Versailles ; membre du groupe MPM (MPM Audiolight) qui donne accès à un très large parc son, lumière, vidéo et structure avec technicien ; pionnier du mapping ; bureau d'étude intégré (études 2D/3D, maquettes, prévisualisations, audit terrain) ; un chargé d'affaires interlocuteur unique du brief à la réalisation ; « une proposition en 24 heures » ; Technisite : équipe dédiée, disponibilité 7j/7, matériel complémentaire mobilisable sous 2 h ; RSE : parc entretenu et reconditionné, tournées mutualisées et logistique optimisée, matériel à basse consommation, politique RH inclusive et formation interne ; Trophée de la meilleure réalisation audiovisuelle 2019 reçu au salon Heavent Paris ; références affichées sur le site : Nissan, Air France, Ville de Lyon, Barrière, The Ritz-Carlton, Le Meurice, Burj Al Arab ; signature : « Rendre l'éphémère inoubliable » ; Instagram @vls_event. N'avance AUCUN autre chiffre global (nombre de prestations par an, taille du parc, nombre de lieux) : ces chiffres varient selon les pages du site."};
const DEF={settings:{apiKey:'',model:'claude-sonnet-5-5'},user:'Lise',prof:{},goals:{linkedin:{start:2813,goal:3500},instagram:{start:1545,goal:2000}},posts:[],fol:[],rev:0,learn:{rules:[],summary:'',count:0,at:null},trends:null,ideaRef:null};
function norm(d){d=d||{};const x=structuredClone(DEF);return{...x,...d,settings:{...x.settings,...(d.settings||{})},prof:d.prof||{},goals:{linkedin:{...x.goals.linkedin,...((d.goals||{}).linkedin||{})},instagram:{...x.goals.instagram,...((d.goals||{}).instagram||{})}},posts:(d.posts||[]).map(p=>({...p,platform:p.platform==='instagram'?'instagram':'linkedin',m:{impressions:0,likes:0,comments:0,shares:0,saves:0,clicks:0,...(p.m||{})}})),fol:d.fol||[],learn:{...x.learn,...(d.learn||{})},user:d.user||'Lise'}}
let S=load();
const B=()=>({...BRAND,...S.prof});
const L=()=>S.learn;
function curFol(pl){const h=S.fol.filter(f=>f.platform===pl).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:x.at-y.at);return h.length?h[h.length-1].n:S.goals[pl].start}
let tab='dashboard';let period=0;let dnet='all';let charts={};
function load(){try{return norm(JSON.parse(localStorage.getItem(KEY)))}catch{return norm({})}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Sauvegarde impossible : '+e.message,6000)}}
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function toast(m,ms=3500){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',ms)}
const fmt=n=>n==null||isNaN(n)?'–':Number(n).toLocaleString('fr-FR',{maximumFractionDigits:1});

/* ===================== MÉTRIQUES ===================== */
const MK=[['impressions','Impressions / vues'],['likes','J\'aime'],['comments','Commentaires'],['shares','Partages / envois'],['saves','Enregistrements'],['clicks','Clics']];
const EMPTY_M=()=>({impressions:0,likes:0,comments:0,shares:0,saves:0,clicks:0});
const inter=p=>(+p.m?.likes||0)+(+p.m?.comments||0)+(+p.m?.shares||0)+(+p.m?.saves||0);
const er=p=>p.m?.impressions>0?inter(p)/p.m.impressions*100:null;
const ctr=p=>p.m?.impressions>0?(+p.m.clicks||0)/p.m.impressions*100:null;
const measured=()=>S.posts.filter(p=>p.status==='published'&&p.m?.impressions>0);
function feats(t){return{q:/\?/.test(t),emoji:/\p{Extended_Pictographic}/u.test(t),list:/^\s*([-•→✅▪️]|\d+[.)])/m.test(t),num:/\d/.test(t),tags:/#[\p{L}\w]+/u.test(t),long:t.length>900,short:t.length<400}}
const FL={q:'Contient une question',emoji:'Contient des emojis',list:'Format liste',num:'Contient des chiffres',tags:'Contient des hashtags',long:'Post long (>900 car.)',short:'Post court (<400 car.)'};
function insights(plat){
  const M=measured().filter(p=>!plat||p.platform===plat);if(M.length<6)return[];
  const rate=a=>{const i=a.reduce((t,p)=>t+p.m.impressions,0);return i?a.reduce((t,p)=>t+inter(p),0)/i*100:0};
  const out=[];
  for(const k in FL){
    const w=M.filter(p=>feats(p.text)[k]),wo=M.filter(p=>!feats(p.text)[k]);
    if(w.length<3||wo.length<3)continue;
    const x=rate(w),y=rate(wo);
    out.push({k,label:FL[k],with:x,without:y,diff:y?((x-y)/y*100):0,n:[w.length,wo.length]});
  }
  return out.sort((p,q)=>Math.abs(q.diff)-Math.abs(p.diff));
}

/* ===================== API CLAUDE ===================== */
async function claude(system,user,max=3000){
  if(!S.settings.apiKey)throw new Error('Ajoute ta clé API Anthropic dans Réglages.');
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:S.settings.model,max_tokens:max,system,messages:[{role:'user',content:user}]})});
  const j=await r.json();if(!r.ok)throw new Error(j.error?.message||('Erreur '+r.status));
  return j.content.map(c=>c.text||'').join('');
}
function repairJSON(t){
  let out='',inS=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(!inS){out+=c;if(c==='"')inS=true;continue}
    if(c==='\\'){out+=c+(t[i+1]??'');i++;continue}
    if(c==='\n'){out+='\\n';continue}
    if(c==='\r')continue;
    if(c==='\t'){out+='\\t';continue}
    if(c==='"'){const m=t.slice(i+1).match(/^\s*(.)/),n=m?m[1]:'';
      if(!n||',:}]'.includes(n)){out+=c;inS=false}else out+='\\"';continue}
    out+=c}
  return out.replace(/,\s*([}\]])/g,'$1')}
function parseJSON(t){
  t=String(t).replace(/```(?:json)?/gi,'');
  const c=[],a=t.indexOf('{'),b=t.lastIndexOf('}'),x=t.indexOf('['),y=t.lastIndexOf(']');
  const O=a>=0&&b>a?t.slice(a,b+1):null,A=x>=0&&y>x?t.slice(x,y+1):null;
  if(A&&(!O||x<a))c.push(A);if(O)c.push(O);if(A&&!c.includes(A))c.push(A);
  for(const z of c)for(const w of[z,repairJSON(z)]){try{return JSON.parse(w)}catch{}}
  throw new Error('Réponse IA invalide')}
const pDesc=p=>`[${p.platform}] ER ${fmt(er(p))}% | CTR ${fmt(ctr(p))}% | ${p.m.impressions} impr, ${p.m.likes} j'aime, ${p.m.comments} com., ${p.m.shares} partages, ${p.m.saves||0} enregistrements, ${p.m.clicks} clics\n"""${p.text}"""`;
function perfContext(plats){
  plats=plats||PLS;
  let c='';
  if(L().rules.length)c+='RÈGLES APPRISES (à appliquer en priorité):\n'+L().rules.map((l,i)=>`${i+1}. ${l}`).join('\n')+'\n\n';
  else c+='RÈGLES APPRISES: aucune pour l\'instant.\n\n';
  for(const pl of plats){
    const M=measured().filter(p=>p.platform===pl).sort((a,b)=>er(b)-er(a));
    if(!M.length)continue;
    c+=`RÉSULTATS ${PLN[pl].toUpperCase()} (${M.length} posts mesurés)\nMeilleurs posts:\n`+M.slice(0,2).map(pDesc).join('\n---\n')+'\n\n';
    if(M.length>3)c+='Pire post (à ne pas reproduire):\n'+M.slice(-1).map(pDesc).join('')+'\n\n';
    const ins=insights(pl).slice(0,4);
    c+=ins.length?`Corrélations ${PLN[pl]} (taux cumulé = interactions / impressions; INDICATIVES, petits échantillons, sans preuve de causalité):\n`+ins.map(i=>`- ${i.label}: ${fmt(i.with)}% (${i.n[0]} posts) vs ${fmt(i.without)}% sans (${i.n[1]} posts)`).join('\n')+'\n\n':`Pas assez de posts ${PLN[pl]} pour des corrélations fiables (6 minimum): explore des angles variés.\n\n`;
  }
  c+='HIÉRARCHIE DES INFORMATIONS: 1) faits de la fiche réalisation et faits VLS, 2) règles apprises, 3) objectif demandé, 4) règles du brief, 5) corrélations (à ne suivre que si elles ne contredisent pas 1 à 4). Ne conclus jamais qu\'un élément « ne marche pas » sur moins de 6 posts.';
  return c;
}
const IMGR=`Pour chaque post, ajoute le champ "image" : une suggestion concrète de visuel (1 à 2 phrases). Pour Instagram, précise le format : photo unique, carrousel (nombre d'images et contenu de chacune) ou reel (durée, plans). Privilégie les vraies images du projet (mapping de nuit, public, régie, montage, techniciens en action) ; jamais de photo de stock. Texte à incruster éventuel : très court.`;
const SYS=()=>`Tu es un expert en copywriting social media B2B francophone, spécialiste de l'événementiel et du spectacle. Tu écris des posts qui génèrent du commentaire, du partage, des enregistrements et des demandes de devis.
Marque: ${B().name}. Activité: ${B().sector}. Audience: ${B().audience}. Ton: ${B().tone}. Piliers de contenu: ${B().pillars}.
${B().facts}
Règles: accroche forte dans la 1re ligne (avant le "voir plus"), phrases courtes, aérées, une idée par post, une fin qui invite à agir ou échanger selon l'objectif (si les résultats ou les règles apprises montrent qu'un type de fin freine l'engagement, choisis-en un autre).
EXACTITUDE (impératif): n'utilise que les faits de la FICHE RÉALISATION fournie et des faits VLS ci-dessus. N'invente ni chiffre, ni date, ni matériel, ni marque d'équipement, ni anecdote, ni citation, ni nom de personne. Si un détail manque, reste général ou formule-le comme une question au public. Ne décris pas de scan laser ou de modélisation 3D pour un projet si la fiche ne le mentionne pas. Remercie les partenaires cités dans la fiche quand c'est pertinent.
LinkedIn: 600-1300 caractères, 0-3 emojis max, 3-5 hashtags en fin. Si un lien est pertinent, place exactement {{LINK}} là où il doit apparaître (il sera remplacé par un lien tracké).
Instagram: légende de 150 à 700 caractères, accroche de moins de 125 caractères, emojis bienvenus (3 à 6), 8 à 15 hashtags pertinents en bloc à la fin (#mapping #videomapping #eventtech #evenementiel… adaptés au sujet), pas de lien cliquable : écris « lien en bio » à la place, invite à enregistrer ou à commenter.
Réponds UNIQUEMENT avec un JSON valide.`;

async function generate(){
  const topic=$('#topic').value.trim(),plat=$('#plat').value,n=+$('#n').value,goal=$('#goal').value;
  if(!topic)return toast('Indique un sujet ou choisis une idée.');
  const btn=$('#gen');btn.disabled=true;btn.textContent='Génération…';
  try{
    const [sys,user]=genParts(topic,plat,n,goal);
    const out=parseJSON(await claude(sys,user,4000));
    addGenerated(out.posts||[],topic);
    toast(`${(out.posts||[]).length} posts générés ✔`);go('posts');
  }catch(e){toast('Erreur : '+e.message,6000)}
  btn.disabled=false;btn.textContent='Générer les posts (clé API)';
}
function addGenerated(arr,topic){arr.forEach(p=>S.posts.unshift({id:uid(),platform:p.platform==='instagram'?'instagram':'linkedin',angle:p.angle||'',text:p.text,image:p.image||'',topic,source:'generated',status:'draft',createdAt:new Date().toISOString(),m:EMPTY_M()}));save()}

function analyzeParts(M){
  const user=`Voici les résultats de mes posts VLS (ER = taux d'engagement, CTR = taux de clic):\n\n${M.map(pDesc).join('\n---\n')}\n\nCorrélations calculées:\n${PLS.flatMap(pl=>insights(pl).map(i=>`- ${PLN[pl]} · ${i.label}: ${fmt(i.with)}% (${i.n[0]} posts) vs ${fmt(i.without)}% (${i.n[1]} posts)`)).join('\n')||'échantillon insuffisant'}\n\nAnciennes règles:\n${L().rules.join('\n')||'aucune'}\n\nMission: analyse ce qui fonctionne et ce qui échoue, et produis 5 à 8 règles d'écriture concrètes, actionnables et priorisées pour mes prochains posts (accroches, longueur, format, CTA, sujets et types de réalisations, visuels, différences LinkedIn/Instagram). Fusionne/corrige les anciennes règles. Reste prudent si l'échantillon est petit.\nFormat: {"rules":["..."],"summary":"2 phrases"}`;
  return['Tu es un analyste de performance social media. Réponds uniquement en JSON valide.',user]}
function applyLearn(o,M){S.learn.rules=o.rules||[];S.learn.summary=o.summary||'';S.learn.count=M.length;S.learn.at=new Date().toISOString();save()}
async function analyze(auto){
  const M=measured();if(M.length<3){if(!auto)toast('Il faut au moins 3 posts publiés avec des résultats.');return}
  if(!S.settings.apiKey){if(auto)toast('3 nouveaux posts mesurés : mets à jour les règles dans Apprentissage (mode sans clé).',6000);else toast('Pas de clé API : utilise le mode sans clé ci-dessous.',6000);return}
  try{
    const [sys,user]=analyzeParts(M);
    applyLearn(parseJSON(await claude(sys,user,2000)),M);
    toast('Apprentissage mis à jour ✔');if(tab==='learn')render();
  }catch(e){toast('Analyse impossible : '+e.message,6000)}
}
function maybeAnalyze(){const n=measured().length;if(n>=3&&n-L().count>=3)analyze(true)}

function linkFor(p){
  if(p.platform==='instagram')return 'lien en bio';
  const site=B().site;if(!site)return '';
  try{const u=new URL(site);u.searchParams.set('utm_source',p.platform);u.searchParams.set('utm_medium','social');u.searchParams.set('utm_campaign','ppvls_'+p.id);return u.toString()}catch{return site}
}
const finalText=p=>p.text.replaceAll('{{LINK}}',linkFor(p));
async function copyPost(id){const p=S.posts.find(x=>x.id===id);try{await navigator.clipboard.writeText(finalText(p));toast(p.platform==='linkedin'?'Copié ✔ (lien UTM inclus)':'Copié ✔')}catch{toast('Copie impossible : autorise le presse-papiers.')}}
function openNet(id){const p=S.posts.find(x=>x.id===id);copyPost(id);
  window.open(p.platform==='linkedin'?'https://www.linkedin.com/feed/?shareActive=true&text='+encodeURIComponent(finalText(p)):'https://www.instagram.com/vls_event/','_blank')}
function publish(id){const p=S.posts.find(x=>x.id===id);p.status='published';p.publishedAt=new Date().toISOString();save();render();toast('Marqué comme publié. Reviens saisir les résultats dans 48 h.')}
function delPost(id){if(!confirm('Supprimer ce post ?'))return;S.posts=S.posts.filter(p=>p.id!==id);save();render()}
function saveMetrics(id){
  const p=S.posts.find(x=>x.id===id),m={};
  MK.forEach(([k])=>m[k]=+$('#'+k+'_'+id).value||0);p.m=m;
  save();render();toast('Résultats enregistrés ✔');maybeAnalyze();
}
function editImg(id){const p=S.posts.find(x=>x.id===id);p.image=$('#img_'+id).value;save();toast('Suggestion d\'image enregistrée ✔')}
function editText(id){const p=S.posts.find(x=>x.id===id);p.text=$('#t_'+id).value;save();toast('Texte modifié ✔')}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='postpilot-vls-sauvegarde.json';a.click()}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=norm(JSON.parse(r.result));save();render();toast('Import réussi ✔')}catch{toast('Fichier invalide')}};r.readAsText(f)}
function reset(){if(confirm('Effacer TOUTES les données ?')){S=norm({});save();render()}}

let BANK=null;

function bank(){

  const add=x=>{if(seen.has(x.t))return;seen.add(x.t);out.push(x)};

    if(c==='c'&&!e.c)return;if(c==='y'&&!e.y)return;if(c==='n'&&!e.n)return;if(c==='l'&&!e.l)return;
    if(c==='m'&&e.th!=='map')return;if(c==='v'&&!['conv','hyb'].includes(e.th))return;
    add({t:t.replace(/\{E\}/g,e.t).replace(/\{C\}/g,e.c).replace(/\{Y\}/g,e.y).replace(/\{L\}/g,e.l).replace(/\{K\}/g,e.cat.toLowerCase()),k,f,e:ei,src:'ev',th:e.th})}));
  SERV.forEach(([s,th])=>TPL_S.forEach(([k,f,,t])=>add({t:t.replace('{S}',cap(s)),k,f,e:-1,src:'serv',th})));
  FORMATS.forEach(([s,th])=>TPL_F.forEach(([k,f,,t])=>add({t:t.replace('{F}',cap(s)),k,f,e:-1,src:'fmt',th})));
  BLOG.forEach(b=>{const th=thOf(b);add({t:b,k:'E',f:'',e:-1,src:'blog',th});add({t:b+' : l\'essentiel en 3 points',k:'E',f:'list',e:-1,src:'blog',th});add({t:b+' : vos questions, nos réponses',k:'Q',f:'q',e:-1,src:'blog',th})});
  OTHER.forEach(([t,k,f])=>add({t,k,f:f||'',e:-1,src:'other',th:thOf(t)}));
  return BANK=out}

function ideaWeights(){
  const M=measured();if(M.length<3)return null;
  const val=p=>(+p.m.likes||0)+3*(+p.m.comments||0)+3*(+p.m.shares||0)+3*(+p.m.saves||0)+2*(+p.m.clicks||0);
  const g=M.reduce((t,p)=>t+val(p),0)/M.length;if(!g)return null;
  const ratio=a=>(a.reduce((t,p)=>t+val(p),0)+g)/(a.length+1)/g;
  const th={};Object.keys(THEMES).forEach(k=>{const a=M.filter(p=>THEMES[k].re.test(p.text));th[k]=a.length?ratio(a):1});
  const fm={};['q','list','num'].forEach(f=>{const a=M.filter(p=>feats(p.text)[f]),o=M.length-a.length;fm[f]=a.length>=4&&o>=4?ratio(a):1});
  const kd={};Object.keys(KIND).forEach(k=>{const a=M.filter(p=>postKind(p)===k);kd[k]=a.length>=3?ratio(a):1});
  return{th,fm,kind:kd,n:M.length}}

  let a=h>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function drawIdeas(seen){
  const bk=bank(),w=ideaWeights(),used=new Set(S.posts.map(p=>p.topic));
  let pool=bk.filter(x=>!used.has(x.t)&&!seen.has(x.t));if(pool.length<20)pool=bk.filter(x=>!used.has(x.t));if(pool.length<20)pool=bk;
  const sc=x=>w?(x.th?w.th[x.th]||1:1)*(x.f?w.fm[x.f]||1:1)*(w.kind[x.k]||1):1;
  const picked=[],hot=new Set(),ce={},ck={},cs={};
  const ok=x=>!picked.includes(x)&&(x.e<0||!ce[x.e])&&(ck[x.k]||0)<3&&(cs[x.src]||0)<(x.src==='ev'?6:3);
  const take=(n,wf,hotOn)=>{for(let i=0;i<n;i++){
    const c=pool.filter(ok);if(!c.length)break;
    let r=RND()*c.reduce((t,x)=>t+wf(x),0),y=c[c.length-1];
    for(const x of c){r-=wf(x);if(r<=0){y=x;break}}
    picked.push(y);if(y.e>=0)ce[y.e]=1;ck[y.k]=(ck[y.k]||0)+1;cs[y.src]=(cs[y.src]||0)+1;if(hotOn&&sc(y)>=1.2)hot.add(y)}};
  /* priorité aux réalisations : poids x3 */
  const base=x=>x.src==='ev'?3:1;
  take(w?7:10,x=>base(x)*(w?Math.pow(sc(x),3):1),!!w);
  if(w)take(3,base,false);
  return picked.map(y=>({t:y.t,k:y.k,hot:hot.has(y)}))}

const IMP={rows:[],raw:'',name:'',busy:false,def:'auto'};
function loadPdfJs(){return new Promise((res,rej)=>{if(window.pdfjsLib)return res(window.pdfjsLib);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib)};s.onerror=()=>rej(new Error('lecteur PDF indisponible (connexion internet requise)'));document.head.appendChild(s)})}
async function pdfText(file){

  for(let p=1;p<=pdf.numPages;p++){const pg=await pdf.getPage(p),tc=await pg.getTextContent(),rows=[];
    tc.items.forEach(it=>{const s=(it.str||'').trim();if(!s)return;const y=it.transform[5],x=it.transform[4];let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r){r={y,c:[]};rows.push(r)}r.c.push({x,s})});
    rows.sort((a,b)=>b.y-a.y).forEach(r=>out.push(r.c.sort((a,b)=>a.x-b.x).map(c=>c.s).join(' ').replace(/\s+/g,' ').trim()));out.push('')}
  return out.join('\n')}
const MON=[['janv',1],['jan',1],['févr',2],['fevr',2],['fév',2],['feb',2],['mars',3],['mar',3],['avr',4],['apr',4],['mai',5],['may',5],['juin',6],['jun',6],['juil',7],['jul',7],['août',8],['aout',8],['aug',8],['sept',9],['sep',9],['oct',10],['nov',11],['déc',12],['dec',12]];
const monOf=w=>{w=w.toLowerCase();const m=MON.find(([k])=>w.startsWith(k));return m?m[1]:0};
function findDate(l){let m=l.match(/\b(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/);if(m)return`${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m=l.match(/\b(\d{1,2})[\/.](\d{1,2})[\/.](\d{2}|\d{4})\b/);if(m){let y=+m[3];if(y<100)y+=2000;if(+m[2]<=12)return`${y}-${pad(m[2])}-${pad(m[1])}`}
  m=l.match(/\b(\d{1,2})(?:er)?\s+([A-Za-zÀ-ÿ]+)\.?,?\s+(20\d{2})\b/);if(m&&monOf(m[2]))return`${m[3]}-${pad(monOf(m[2]))}-${pad(m[1])}`;
  m=l.match(/\b([A-Za-zÀ-ÿ]+)\.?\s+(\d{1,2}),?\s+(20\d{2})\b/);if(m&&monOf(m[1]))return`${m[3]}-${pad(monOf(m[1]))}-${pad(m[2])}`;
  return''}
const NUM='(\\d{1,3}(?:[\\s\\u202f\\u00a0.]\\d{3})+(?:,\\d+)?|\\d+(?:[.,]\\d+)?)(\\s?[kK])?';
const MRE={impressions:'impressions?|vues|views|affichages|port[ée]e|couverture|reach|comptes touch[ée]s',likes:"j[’']aime|likes?|r[ée]actions?|mentions j[’']aime",comments:'commentaires?|comments?',shares:'partages?|republications?|reposts?|shares?|envois',saves:'enregistrements?|saves?|sauvegardes?',clicks:'clics?|clicks?'};
function toNum(n,k){let v=String(n).replace(/[\s\u202f\u00a0]/g,'');if(k){return Math.round(parseFloat(v.replace(',','.'))*1000)||0}
  if(/^\d{1,3}(\.\d{3})+$/.test(v))v=v.replace(/\./g,'');return Math.round(parseFloat(v.replace(',','.')))||0}
const LBL=new RegExp('^\\s*('+Object.values(MRE).join('|')+')','i');
function lineMetrics(line){const res={};let rest=line;
  /* Ordre de lecture : « Impressions : 1 461 » (libellé puis chiffre) si la ligne commence par un libellé,
     sinon « 2,3 k vues · 120 j'aime » (chiffre puis libellé) en priorité */

    const clean=rest.replace(/\b(20\d{2})[-\/.]\d{1,2}[-\/.]\d{1,2}\b|\b\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4}\b|\b\d{1,2}(?:er)?\s+[A-Za-zÀ-ÿ]+\.?\s+20\d{2}\b/g,'').replace(/^(post|publication)\s+(du|le)\s*/i,'').replace(/\b(linkedin|instagram)\b/ig,'').trim();

function pdfParts(){const raw=IMP.raw.length>90000?IMP.raw.slice(0,90000)+'\n[… texte tronqué]':IMP.raw;

  const gl=pl=>`<div class="f1"><label>${PLN[pl]} : abonnés au départ</label><input type="number" min="0" value="${S.goals[pl].start}" onchange="S.goals.${pl}.start=+this.value||0;save()"></div><div class="f1"><label>${PLN[pl]} : objectif à 90 jours</label><input type="number" min="0" value="${S.goals[pl].goal}" onchange="S.goals.${pl}.goal=+this.value||0;save()"></div>`;

  <div class="note"><b>Sécurité :</b> la clé API reste dans ton navigateur et n'est envoyée qu'à Anthropic. Sans clé, tout fonctionne avec ton abonnement Claude.ai (boutons « Copier le prompt »).</div>
  <div class="card">${inp('apiKey','Clé API Anthropic (facultative)','sk-ant-…','password')}${inp('model','Modèle','claude-sonnet-5-5')}</div>
  <div class="card" style="margin-top:14px"><b>Profil éditorial VLS</b><div class="help">Ces textes sont injectés dans chaque prompt. Modifie-les si le ton ou la cible évoluent.</div>${pfl('audience','Audience cible')}${pfl('tone','Ton éditorial')}${pfl('pillars','Piliers de contenu')}<label>URL du site (liens UTM LinkedIn)</label><input value="${esc(B().site)}" onchange="S.prof.site=this.value.trim();save()"></div>
  <div class="card" style="margin-top:14px"><b>Données</b><div class="row" style="margin-top:10px"><button class="btn sec" onclick="exportData()">⬇ Exporter (JSON)</button><label class="btn sec" style="margin:0;cursor:pointer">⬆ Importer une sauvegarde<input type="file" accept=".json" hidden onchange="importData(event)"></label><button class="btn del" onclick="reset()">Tout effacer</button></div></div>
  <div class="card" style="margin-top:14px"><b>Base de sujets</b><p class="mut" style="line-height:1.6">${EV.length} réalisations issues de vls.fr · ${fmt(bank().length)} sujets de posts. Chaque sujet lié à une réalisation injecte sa fiche (lieu, partenaires, rôle de VLS, chiffres publiés) dans le prompt, pour que l'IA n'invente rien.</p></div>

}

/* ===================== TENDANCES ===================== */
async function claudeWeb(system,user,max=6000){
  if(!S.settings.apiKey)throw new Error('Ajoute ta clé API Anthropic dans Réglages.');
  let msgs=[{role:'user',content:user}],txt='';
  for(let i=0;i<4;i++){
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:S.settings.model,max_tokens:max,system,tools:[{type:'web_search_20250305',name:'web_search',max_uses:6}],messages:msgs})});
    const j=await r.json();if(!r.ok)throw new Error(j.error?.message||('Erreur '+r.status));
    txt+=j.content.filter(c=>c.type==='text').map(c=>c.text).join('');
    if(j.stop_reason!=='pause_turn')break;
    msgs=[...msgs,{role:'assistant',content:j.content}];
  }
  return txt}
function trendsParts(){const b=B(),td=new Date().toLocaleDateString('fr-FR');
  const sys=`Tu es stratège social media pour ${b.name}, ${b.sector}. Audience: ${b.audience}. Ton: ${b.tone}. Piliers: ${b.pillars}. ${b.facts} Tu DOIS t'appuyer sur la recherche web pour identifier ce qui performe actuellement (nous sommes le ${td}). N'invente ni chiffre ni source : si tu ne trouves pas, dis-le. Réponds UNIQUEMENT avec un JSON valide.`;
  const recent=EV.filter(e=>e.y>=2024).map(fiche).join('\n');
  const user=`${perfContext()}\n\nRecherche les tendances, formats, accroches et sujets d'actualité qui fonctionnent en ce moment sur LinkedIn et Instagram dans l'événementiel, la technique audiovisuelle, le mapping vidéo et les fêtes des lumières : ${b.topics}. Regarde ce que publient les acteurs de référence (prestataires techniques, agences événementielles, festivals de lumière, salons comme Heavent) et les événements à venir dans les prochaines semaines (saison, fêtes des lumières, salons, temps forts du secteur). Produis 4 tendances (title, insight, source = URL réelle trouvée) puis 6 posts prêts à publier (3 LinkedIn, 3 Instagram) qui appliquent ces tendances aux piliers de VLS. Quand c'est pertinent, appuie-toi sur une réalisation réelle ci-dessous (et uniquement sur ses faits) :\n${recent}\n"why" = pourquoi ça devrait marcher. Utilise {{LINK}} pour le lien du site sur LinkedIn si pertinent. ${IMGR}\nFormat: {"trends":[{"title":"","insight":"","source":""}],"posts":[{"platform":"linkedin|instagram","pillar":"","angle":"","text":"","image":"","why":""}]}`;
  return[sys,user]}
async function fetchTrends(){
  const btn=$('#tr');btn.disabled=true;btn.textContent='Recherche en cours… (30 à 60 s)';
  try{const [sys,user]=trendsParts();const o=parseJSON(await claudeWeb(sys,user));
    S.trends={at:new Date().toISOString(),trends:o.trends||[],posts:o.posts||[]};save();render();toast('Suggestions mises à jour ✔');
  }catch(e){toast('Erreur : '+e.message,7000);btn.disabled=false;btn.textContent='🔎 Rechercher les tendances maintenant'}}
function addSug(i){const p=S.trends.posts[i];
  S.posts.unshift({id:uid(),platform:p.platform==='instagram'?'instagram':'linkedin',angle:p.angle||p.pillar||'tendance',text:p.text,image:p.image||'',topic:'Suggestion tendances',source:'trend',status:'draft',createdAt:new Date().toISOString(),m:EMPTY_M()});
  save();toast('Ajouté à Mes posts (brouillons) ✔')}
function vTrends(){
  const t=S.trends;
  return`<h1>Tendances & idées</h1><p class="sub">L'IA cherche sur le web ce qui performe dans l'événementiel, la technique audiovisuelle et le mapping, et te propose des posts LinkedIn et Instagram alignés avec les piliers de VLS.</p>
  <div class="note">La recherche se lance quand tu cliques (pas en continu) : relance-la chaque semaine. Vérifie les sources avant de publier.${S.settings.apiKey?'':' Sans clé API : utilise le mode sans clé plus bas, avec la recherche web activée dans Claude.ai.'}</div>
  ${S.settings.apiKey?`<div class="row" style="margin-bottom:16px"><button class="btn" id="tr" onclick="fetchTrends()">🔎 Rechercher les tendances maintenant</button>${t?`<span class="mut">Dernière recherche : ${new Date(t.at).toLocaleString('fr-FR')}</span>`:''}</div>`:''}
  ${noKey('trends')}${t?`<div class="g2">${t.trends.map(x=>`<div class="card"><b>${esc(x.title)}</b><p class="help" style="font-size:13px">${esc(x.insight)}</p>${/^https?:\/\//.test(x.source||'')?`<a href="${esc(x.source)}" target="_blank" rel="noopener" style="font-size:12px">Source ↗</a>`:`<span class="mut">${esc(x.source||'')}</span>`}</div>`).join('')}</div>
  ${t.posts.map((p,i)=>{const pl=p.platform==='instagram'?'instagram':'linkedin';return`<div class="card post"><div class="row"><span class="tag ${PLT[pl]}">${PLN[pl]}</span><span class="mut f1">${esc(p.pillar||'')} · ${esc(p.angle||'')}</span><button class="btn sm ok" onclick="addSug(${i})">➕ Ajouter aux brouillons</button></div><pre>${esc(p.text)}</pre><div class="mut">💡 ${esc(p.why||'')}</div>${p.image?`<div class="mut" style="margin-top:6px">📸 ${esc(p.image)}</div>`:''}</div>`}).join('')}`:`<div class="card empty">Lance une recherche pour obtenir des tendances et des idées de posts.</div>`}`}

/* ===================== MODE SANS CLÉ API (via Claude.ai) ===================== */
function genParts(topic,plat,n,goal){const plats=plat==='both'?PLS:[plat];
  const user=`${perfContext(plats)}\n\nMISSION: écris ${n} variante(s) par plateforme (${plats.map(p=>PLN[p]).join(', ')}) sur ce sujet: "${topic}".${evCtx(topic)}\nObjectif principal: ${goal}. Chaque variante doit utiliser un ANGLE différent (ex: storytelling des coulisses, chiffre fort, liste, question au public, remerciement partenaire, pédagogie technique) pour tester ce qui marche. Respecte les règles propres à chaque réseau. Applique les règles apprises si elles sont fournies, selon la hiérarchie indiquée. ${IMGR}\nFormat: {"posts":[{"platform":"linkedin|instagram","angle":"...","text":"...","image":"..."}]}`;
  return[SYS(),user]}
const noKey=k=>`<div class="card" style="margin:14px 0"><b>${k==='pdf'?'Analyse du PDF par Claude':'Mode sans clé API'}</b> <span class="mut">(avec ton abonnement Claude.ai)</span>
<div class="help"><b>1.</b> ${k==='gen'?'Remplis le sujet, le réseau, l\'objectif et les variantes ci-dessus, puis clique':k==='pdf'?'Si l\'aperçu automatique est incomplet, clique':'Clique'} sur « Copier le prompt ». <b>2.</b> Colle-le dans une conversation Claude.ai${k==='trends'?' <b>avec la recherche web activée</b>':''}. <b>3.</b> Copie la réponse de Claude et colle-la ci-dessous.</div>
<button class="btn sec" onclick="copyPrompt('${k}')">📋 Copier le prompt</button>
<label>Réponse de Claude</label><textarea id="paste_${k}" placeholder="Colle ici la réponse de Claude (le JSON)…"></textarea>
<div style="margin-top:10px"><button class="btn" onclick="importReply('${k}')">📥 ${k==='gen'?'Créer les brouillons':k==='learn'?'Appliquer les règles':k==='pdf'?'Remplir l\'aperçu':'Importer les suggestions'}</button></div></div>`;
async function copyPrompt(k){
  let p;
  if(k==='gen'){const topic=$('#topic').value.trim();if(!topic)return toast('Indique d\'abord un sujet.');p=genParts(topic,$('#plat').value,+$('#n').value,$('#goal').value).join('\n\n')}
  else if(k==='learn'){const M=measured();if(M.length<3)return toast('Il faut au moins 3 posts publiés avec des résultats.');p=analyzeParts(M).join('\n\n')}
  else if(k==='pdf'){if(!IMP.raw)return toast('Dépose d\'abord un PDF.');p=pdfParts().join('\n\n')}
  else p=trendsParts().join('\n\n')+'\n\n(Utilise la recherche web dans cette conversation.)';
  try{await navigator.clipboard.writeText(p+'\n\nRéponds uniquement avec le JSON, dans un seul bloc de code, sans autre texte. Dans les textes, écris les retours à la ligne sous la forme \\n et utilise des guillemets français « » plutôt que des guillemets doubles.');toast('Prompt copié ✔ Colle-le dans Claude.ai',5000)}catch{toast('Copie impossible : autorise le presse-papiers.')}}
function importReply(k){
  const v=$('#paste_'+k).value.trim();if(!v)return toast('Colle d\'abord la réponse de Claude.');
  try{
    const o0=parseJSON(v),o=Array.isArray(o0)?{posts:o0}:o0;
    if(k==='gen'){
      const arr=(o.posts||o.variants||o.drafts||[]).map(p=>({...p,text:p.text||p.texte||p.content||p.post||''})).filter(p=>p.text);if(!arr.length)throw 0;
      addGenerated(arr,$('#topic')?$('#topic').value.trim():'');toast(arr.length+' brouillons créés ✔');go('posts');
    }else if(k==='learn'){
      const r=(o.rules||[]).filter(x=>typeof x==='string'&&x.trim());if(!r.length)throw 0;
      applyLearn({rules:r,summary:o.summary},measured());render();toast(r.length+' règles appliquées ✔');
    }else if(k==='pdf'){
      IMP.rows=rowsFromJSON(o);if(!IMP.rows.length)throw 0;render();toast(IMP.rows.length+' posts dans l\'aperçu : vérifie puis importe ✔');
    }else{
      if(!(o.posts||[]).length&&!(o.trends||[]).length)throw 0;
      S.trends={at:new Date().toISOString(),trends:o.trends||[],posts:o.posts||[]};save();render();toast('Suggestions importées ✔');
    }
  }catch{
    if(k==='gen'&&v.length>80&&confirm("Je n'arrive pas à lire le JSON. Créer un brouillon avec le texte collé tel quel (tu pourras le corriger) ?")){
      S.posts.unshift({id:uid(),platform:$('#plat')&&$('#plat').value==='instagram'?'instagram':'linkedin',angle:'',text:v.replace(/```(?:json)?/gi,'').trim(),image:'',topic:$('#topic')?$('#topic').value.trim():'',source:'generated',status:'draft',createdAt:new Date().toISOString(),m:EMPTY_M()});
      save();toast('Brouillon créé ✔ : vérifie et corrige le texte.',6000);go('posts');return}
    toast('Réponse illisible : colle la réponse complète de Claude (tout le bloc JSON), ou demande-lui de renvoyer uniquement le JSON.',7000)}}

render();
</script>
